name: Test x86_64

on:
  workflow_dispatch:
  push:
    branches: ["master", "feat-*", "fix-*"]
  pull_request:
    branches: ["master", "feat-*", "fix-*"]

env:
  ARCH: x86_64
  HOME: /root
  DISK_SAVE_MODE: "1"
  # The CI container has no Docker daemon; use the archive-backed manifest.
  ROOTFS_MANIFEST: default
  RUSTUP_DIST_SERVER: "https://rsproxy.cn"
  RUSTUP_UPDATE_ROOT: "https://rsproxy.cn/rustup"

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    # Allow the 55-minute guest test budget plus build, cleanup, and diagnostics.
    timeout-minutes: 75
    container:
      image: dragonos/dragonos-dev:v1.24
      options: --privileged -v /dev:/dev
    steps:
      - name: Checkout DragonOS code
        uses: actions/checkout@v4

      - name: Validate test result uploader
        run: python3 -S -m unittest discover -s tools/test-upload

      - name: Change source
        run: |
          find . -type f \( -name "*.toml" -o -name "Makefile" \) -exec sed -i 's/git\.mirrors\.dragonos\.org\.cn/github\.com/g' {} +

      - name: Build DragonOS
        shell: bash -ileo pipefail {0}
        run: |
          make clean
          make -j$(nproc) all

      - name: Run syscall test
        id: test-syscall
        shell: bash -ileo pipefail {0}
        run: |
          make test-syscall

      - name: Preserve syscall serial log
        if: always() && steps.test-syscall.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: gvisor-serial-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: serial_opt.txt
          if-no-files-found: error

      - name: Upload test results
        if: always() && github.repository == 'DragonOS-Community/DragonOS' && steps.test-syscall.outcome != 'skipped'
        shell: bash
        env:
          API_KEY: ${{ secrets.CI_DASHBOARD_UPLOAD_API_KEY }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_ID: ${{ github.sha }}
        run: |
          if [ ! -f "serial_opt.txt" ]; then
            echo "serial_opt.txt is missing; skipping dashboard upload"
            exit 0
          fi

          upload_options=()
          if [ -z "$API_KEY" ]; then
            echo "CI_DASHBOARD_UPLOAD_API_KEY is unset; running in dry-run mode"
            upload_options+=(--dry-run)
          fi

          python3 tools/test-upload/parse_and_upload.py \
            serial_opt.txt https://ci-dashboard.dragonos.org/api/v1 \
            --branch="$BRANCH_NAME" --commit="$COMMIT_ID" --test-type gvisor \
            "${upload_options[@]}"
