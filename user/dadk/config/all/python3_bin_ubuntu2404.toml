# 用户程序名称
name = "python3_bin_ubuntu2404"
# 版本号
version = "3.12.3"
# 用户程序描述信息
description = "Python 3.12 from Ubuntu 24.04 official packages (with runtime dependencies)"
# 构建一次后缓存结果（下载+解包结果不变）
build-once = true
# 安装一次后不再重复安装
install-once = false
# 目标架构
target-arch = ["x86_64"]
# 任务源
[task-source]
type = "build-from-source"
source = "local"
source-path = "user/apps/python3_ubuntu2404"
# 构建相关信息
[build]
build-command = "bash repack.sh"
# 安装相关信息
[install]
in-dragonos-path = "/"
# 清除相关信息
[clean]
clean-command = ""
